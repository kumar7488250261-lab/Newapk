name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version $JAVA_MAJOR is lower than required 17."
            exit 1
          fi
          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          else
            echo "./debug.keystore already exists."
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Listing APKs in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Generated APK is empty at $EXPECTED_APK"
            exit 1
          fi

          echo "APK verified successfully: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          # Extract and sanitize repository name
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -c '[:alnum:]_-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="app"
          fi

          RUN_NUMBER="${{ github.run_number }}"
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          DEST_APK_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$ORIGINAL_APK" "$DEST_APK_PATH"

          if [ ! -f "$DEST_APK_PATH" ] || [ ! -s "$DEST_APK_PATH" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK_PATH"
          echo "asset_path=$DEST_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### Debug APK Build

          - **Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Target Device:** Android

          > **Notice:** This APK is built for testing and development purposes. It is signed with a temporary debug keystore and is not intended for Google Play Store production distribution.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"

          echo "### 🚀 APK Build & Delivery Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Status:** ✅ Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- **GitHub Actions Artifact:** \`app-debug-apk\` (Contains verified \`app-debug.apk\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$TAG" || true

            REPO="${{ github.repository }}"
            SERVER_URL="${{ github.server_url }}"
            RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${TAG}"

            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### 📦 Direct Phone Download (GitHub Release)" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK has been published directly to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release $TAG]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Downloadable APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Installation Note:** Download the \`.apk\` file directly on your phone and tap to install." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*(The standard GitHub Actions artifact \`app-debug-apk\` is also preserved in this workflow run as a backup).* " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete or was skipped. Artifact remains available."
            echo "### ⚠️ GitHub Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK was successfully compiled and is stored as an Actions artifact (\`app-debug-apk\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "Release creation encountered an issue or was restricted by repository permissions." >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK from the **Artifacts** section at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          fi
